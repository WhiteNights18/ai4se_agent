name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, ready_for_review]
  push: {}

permissions:
  contents: read

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: make test
      - run: make quality

  build-binary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[build]'
      - run: make binary
      - run: ./dist/guarded-agent version
      - run: ./dist/guarded-agent demo
      - uses: actions/upload-artifact@v4
        with:
          name: guarded-agent-linux-x86_64
          path: dist/guarded-agent
