stages:
  - test
  - package

unit-test:
  stage: test
  image: python:3.12
  before_script:
    - python -m pip install --upgrade pip
    - python -m pip install -e '.[dev]'
  script:
    - make test

build-binary:
  stage: package
  image: python:3.12
  before_script:
    - python -m pip install --upgrade pip
    - python -m pip install -e '.[build]'
  script:
    - make binary
    - ./dist/guarded-agent version
    - ./dist/guarded-agent demo
  artifacts:
    paths:
      - dist/guarded-agent
