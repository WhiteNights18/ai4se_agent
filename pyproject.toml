[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guarded-agent"
version = "0.1.0"
description = "A locally operated coding agent with deterministic governance."
requires-python = ">=3.12"
dependencies = [
    "cryptography>=43,<46",
    "fastapi>=0.115,<0.117",
    "httpx>=0.28,<1",
    "jinja2>=3.1,<4",
    "pydantic>=2.10,<3",
    "python-multipart>=0.0.20,<1",
    "typer>=0.15,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
