{% extends "base.html" %}{% block content %}<h2>Approvals</h2><ul>{% for approval in approvals %}<li><strong>{{ approval.status.value }}</strong> {{ approval.summary }}<form method="post" action="/approvals/{{ approval.id }}/approve"><input type="hidden" name="_csrf" value="{{ csrf_token }}"><button>Approve</button></form><form method="post" action="/approvals/{{ approval.id }}/reject"><input type="hidden" name="_csrf" value="{{ csrf_token }}"><button>Reject</button></form></li>{% else %}<li>No pending approvals.</li>{% endfor %}</ul>{% endblock %}
