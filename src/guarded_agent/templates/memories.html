{% extends "base.html" %}{% block content %}<h2>Memories</h2><form method="post" action="/memories"><input type="hidden" name="_csrf" value="{{ csrf_token }}"><label>Category <input name="category" required></label><label>Content <textarea name="content" required></textarea></label><button>Save memory</button></form><ul>{% for memory in memories %}<li><strong>{{ memory.category }}</strong>: {{ memory.content }}<form method="post" action="/memories/{{ memory.id }}/delete"><input type="hidden" name="_csrf" value="{{ csrf_token }}"><button>Delete</button></form></li>{% else %}<li>No saved memories.</li>{% endfor %}</ul>{% endblock %}
